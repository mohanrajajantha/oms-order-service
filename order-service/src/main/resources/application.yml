server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: postgres # Use your postgres username
    password: admin@123 # Use your postgres password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20       # Max concurrent DB connections
      minimum-idle: 5             # Keep 5 connections warm and ready
      connection-timeout: 20000   # Max time (ms) to wait for a connection before failing
      idle-timeout: 300000        # Max time (ms) a connection can sit idle
      max-lifetime: 1800000       # Max time (ms) a connection can live (prevents DB-side disconnect errors)
  jpa:
    hibernate:
      ddl-auto: validate # Let Flyway handle migrations
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    template:
      observation-enabled: true # Injects Trace IDs into outbound messages
    listener:
      observation-enabled: true # Reads Trace IDs from inbound messages
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: order-group
      auto-offset-reset: latest
      properties:
        spring.json.trusted.packages: "*"
        # Add these two lines to handle the inventory response:
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.oms.order_service.event.InventoryProcessedEvent

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/


resilience4j.circuitbreaker:
  instances:
    catalogService:
      registerHealthIndicator: true
      slidingWindowSize: 10 # Evaluates the last 10 calls
      minimumNumberOfCalls: 5 # Needs at least 5 calls before calculating failure rate
      permittedNumberOfCallsInHalfOpenState: 3
      waitDurationInOpenState: 10s # How long to wait before trying the service again
      failureRateThreshold: 50 # If 50% of calls fail, trip the circuit
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, env, loggers
  endpoint:
    health:
      show-details: always # Shows exactly WHICH component failed (e.g., Database or Kafka)
  metrics:
    tags:
      application: ${spring.application.name} # Tags all metrics with the service name
  tracing:
    sampling:
      probability: 1.0 # Trace 100% of requests
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans # The URL of our Zipkin server
logging:
  pattern:
    # This formats your console logs to inject [Service-Name, Trace-ID, Span-ID]
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"


